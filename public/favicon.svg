<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#080810"/>
  <!-- 4-node brand mark -->
  <!-- Node: top-left -->
  <rect x="4" y="4" width="10" height="10" rx="2.5" fill="none" stroke="#EE9427" stroke-width="1.5"/>
  <!-- Node: top-right -->
  <rect x="18" y="4" width="10" height="10" rx="2.5" fill="none" stroke="#0C4F8C" stroke-width="1.5"/>
  <!-- Node: bottom-left -->
  <rect x="4" y="18" width="10" height="10" rx="2.5" fill="none" stroke="#0C4F8C" stroke-width="1.5"/>
  <!-- Node: bottom-right -->
  <rect x="18" y="18" width="10" height="10" rx="2.5" fill="none" stroke="#EE9427" stroke-width="1.5"/>
  <!-- Connector lines -->
  <line x1="14" y1="9" x2="18" y2="9" stroke="#EE9427" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9" y1="14" x2="9" y2="18" stroke="#0C4F8C" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23" y1="14" x2="23" y2="18" stroke="#0C4F8C" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="23" x2="18" y2="23" stroke="#EE9427" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center crosshair -->
  <line x1="14" y1="16" x2="18" y2="16" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="14" x2="16" y2="18" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-linecap="round"/>
</svg>
